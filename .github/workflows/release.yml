name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore OpenScanSim.slnx

      - name: Run Test Suite
        run: dotnet test --no-restore --verbosity normal

      - name: Publish Standalone GUI (.exe)
        run: >
          dotnet publish src/OpenScanSim.UI/OpenScanSim.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o release_dist/gui

      - name: Publish Standalone CLI (.exe)
        run: >
          dotnet publish src/OpenScanSim.Cli/OpenScanSim.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o release_dist/cli

      - name: Rename & Package Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release_dist/package" -Force
          Copy-Item "release_dist/gui/OpenScanSim.UI.exe" -Destination "release_dist/package/OpenRFID-Simulator-UI.exe"
          Copy-Item "release_dist/cli/openscansim.exe" -Destination "release_dist/package/openscansim-cli.exe"
          Copy-Item "README.md" -Destination "release_dist/package/"
          Copy-Item "LICENSE" -Destination "release_dist/package/"
          
          Compress-Archive -Path "release_dist/package/*" -DestinationPath "release_dist/OpenRFID-Simulator-v1.0.0-win-x64.zip" -Force
          
          # Generate SHA256 Checksums
          Get-FileHash -Algorithm SHA256 "release_dist/package/OpenRFID-Simulator-UI.exe" | Out-File "release_dist/package/OpenRFID-Simulator-UI.exe.sha256"
          Get-FileHash -Algorithm SHA256 "release_dist/package/openscansim-cli.exe" | Out-File "release_dist/package/openscansim-cli.exe.sha256"
          Get-FileHash -Algorithm SHA256 "release_dist/OpenRFID-Simulator-v1.0.0-win-x64.zip" | Out-File "release_dist/OpenRFID-Simulator-v1.0.0-win-x64.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenRFID & Barcode Simulator v${{ github.ref_name || '1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_dist/package/OpenRFID-Simulator-UI.exe
            release_dist/package/openscansim-cli.exe
            release_dist/OpenRFID-Simulator-v1.0.0-win-x64.zip
            release_dist/package/OpenRFID-Simulator-UI.exe.sha256
            release_dist/package/openscansim-cli.exe.sha256
            release_dist/OpenRFID-Simulator-v1.0.0-win-x64.zip.sha256
